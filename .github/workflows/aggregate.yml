name: Aggregate Proxy Subscriptions

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true # Включает кэш Go модулей и билда

      - name: Cache sing-box Core
        uses: actions/cache@v4
        with:
          path: ./sing-box
          key: ${{ runner.os }}-singbox-1.8.11

      - name: Run Proxy Engine
        run: |
          go run main.go

      - name: Commit and Push results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add output_raw.txt output_base64.txt
          git commit -m "Auto-update proxy list [skip ci]" || exit 0
          git push
